name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / Qt ${{ matrix.qt_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        qt_version:
          - 5.15.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}

      - name: Show tool versions
        shell: bash
        run: |
          cmake --version
          ninja --version

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vitals-${{ matrix.os }}-qt${{ matrix.qt_version }}
          path: |
            build/bin
          if-no-files-found: error
