name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / Qt ${{ matrix.qt_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt_version: 5.15.2
            qt_arch: gcc_64
          - os: windows-2022
            qt_version: 5.15.2
            qt_arch: win64_msvc2019_64
          - os: macos-15-intel
            qt_version: 5.15.2
            qt_arch: clang_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}

      - name: Show tool versions
        shell: bash
        run: |
          cmake --version
          if command -v ninja >/dev/null 2>&1; then
            ninja --version
          fi

      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja

      - name: Configure
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vitals-${{ matrix.os }}-qt${{ matrix.qt_version }}
          path: |
            build/bin
          if-no-files-found: error
